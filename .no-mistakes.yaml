# no-mistakes per-repo gate config for aditor-scorecard.
#
# Single deterministic test command (explicit - never auto-detection). The check is the
# hermetic production build: if the SPA compiles against the committed non-secret
# `.env.test` placeholders, it ships. See AGENTS.md > Tests.
#
#   npm ci                            - deterministic install from package-lock.json
#   npm run build -- --mode test      - "the build is the first test"; bakes .env.test
#
# lint is deliberately excluded: it is currently broken (no eslint.config.js; ESLint 9
# requires one) and is not part of the baseline. See AGENTS.md > Known facts.
#
# One test surface, hermetic (no real network):
#   dashboard/  - the build described above.
# (The collector/ vitest suite was removed 2026-07-07 when the IG metrics collector Worker
#  was decommissioned; IG metric collection is being rebuilt as n8n workflows. The browser
#  suite was removed 2026-08-20.)
commands:
  test: (cd dashboard && npm ci && npm run build -- --mode test)
